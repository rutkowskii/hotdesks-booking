name: hotdesks-booking

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: hotdesks-booking
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username=postgres --dbname=hotdesks-booking"]
      interval: 5s
      timeout: 5s
      retries: 10

  test-postgres:
    image: postgres:17-alpine
    command: ["postgres", "-p", "5433"]
    environment:
      POSTGRES_DB: test-hotdesks-booking
      POSTGRES_USER: test-postgres
      POSTGRES_PASSWORD: test-postgres
      PGPORT: "5433"
    ports:
      - "5433:5433"
    volumes:
      - test-postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --port=5433 --username=test-postgres --dbname=test-hotdesks-booking"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  test-postgres-data:
